# Production on one server:  cd deploy/docker && docker compose up -d --build
# Secrets and settings come from deploy/docker/.env (copy .env.example). See project_context/DEPLOYMENT.md.
name: triage

x-app: &app
  build: { context: ../.., dockerfile: Dockerfile }
  image: triage-app:latest
  restart: unless-stopped
  env_file: .env
  environment:
    TRIAGE_DATABASE_URL: postgresql://triage:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/triage
  volumes: [landing:/app/data]
  depends_on:
    db: { condition: service_healthy }
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: triage
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 5s
      retries: 30
    shm_size: 256mb
    # no ports: only reachable from the other containers

  api:
    <<: *app
    # apply new migrations on every start, then serve API + web app
    entrypoint: ["sh", "-c", "python -m triage migrate && exec python -m triage serve --host 0.0.0.0 --port 8000"]

  scheduler:
    <<: *app
    command: ["scheduler"]
    healthcheck:   # database reachable and the job plan computes
      test: ["CMD", "python", "-m", "triage", "scheduler", "--dry-run"]
      interval: 5m
      timeout: 60s
      start_period: 30s
    stop_grace_period: 30s
    depends_on:
      api: { condition: service_healthy }   # api has applied migrations first

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in .env, e.g. 13-233-10-20.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  pgdata:
  landing:
  caddy_data:
  caddy_config:
